<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Touch input</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Prompt:wght@400;500;600&family=Noto+Serif+Thai:wght@400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --color-paper: #050d0a; --color-ink: #e6f4ee; --color-muted: #8fb3a5; }
  body { font-family: 'Geist','Prompt',system-ui,sans-serif; background: var(--color-paper); color: var(--color-ink);
         min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
  .frame { max-width: 1200px; width: 100%; }
  .diagram-container { width: 100%; overflow-x: auto; }
  .eyebrow { font-family: 'Geist Mono',ui-monospace,monospace; font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
             text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
  h1 { font-family: 'Instrument Serif','Noto Serif Thai',serif; font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
       letter-spacing: -0.02em; line-height: 1.25; color: var(--color-ink); margin-bottom: 1.5rem; }
  svg { width: 100%; min-width: 960px; display: block; }
  @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
</style>
</head>
<body>
<div class="frame">
<p class="eyebrow">State machine · ทัชสกรีน</p>
<h1>ทัชสกรีน และการกันคลิกหลังตื่น</h1>
<div class="diagram-container">

<title id="fsm-touch-title">Touch input</title>
<desc id="fsm-touch-desc">State machine of the polled touch input, including the blocked state that ignores the finger used to wake the board.</desc>

<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2ed3ff"/></marker>
</defs>
<rect width="100%" height="100%" fill="#050d0a"/>
<!-- transitions first, then labels, then nodes -->

<path d="M 568 184 L 688 184" fill="none" stroke="#8fb3a5" stroke-width="1.2" marker-end="url(#arrow)"/>

<path d="M 156 160 C 156 112, 212 112, 212 160" fill="none" stroke="#8fb3a5" stroke-width="1.2" marker-end="url(#arrow)"/>

<text x="480" y="220" fill="#8fb3a5" font-size="11" font-family="'Prompt','Geist',system-ui,sans-serif" text-anchor="middle">ไม่มีการแตะ</text>
<rect x="688" y="160" width="176" height="72" rx="8" fill="#050d0a"/>

<text x="184" y="220" fill="#8fb3a5" font-size="11" font-family="'Prompt','Geist',system-ui,sans-serif" text-anchor="middle">นิ้วที่ใช้ปลุก ≠ คลิก</text>

<text x="32" y="356" fill="#8fb3a5" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" letter-spacing="0.14em">LEGEND</text>

<text x="224" y="356" fill="#8fb3a5" font-size="11" font-family="'Prompt','Geist',system-ui,sans-serif">หลังตื่นจาก Stop 2</text>

<line x1="436" y1="352" x2="456" y2="352" stroke="#8fb3a5" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<text x="464" y="356" fill="#8fb3a5" font-size="11" font-family="'Prompt','Geist',system-ui,sans-serif">ยกนิ้ว</text>
</svg>
</div>
</div>
</body>
</html>
