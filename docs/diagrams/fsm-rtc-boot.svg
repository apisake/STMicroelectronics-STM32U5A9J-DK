<text x="148" y="676" fill="#8fb3a5" font-size="11" font-family="'Prompt','Geist',system-ui,sans-serif">เริ่ม / จบ</text>
<rect x="228" y="666" width="20" height="12" rx="3" fill="#0b1a14" stroke="#e6f4ee"/>
<text x="256" y="676" fill="#8fb3a5" font-size="11" font-family="'Prompt','Geist',system-ui,sans-serif">ขั้นตอน</text>
<polygon points="326,664 336,672 326,680 316,672" fill="#0b1a14" stroke="#e6f4ee"/>
<text x="344" y="676" fill="#8fb3a5" font-size="11" font-family="'Prompt','Geist',system-ui,sans-serif">ตัดสินใจ</text>
<rect x="412" y="666" width="20" height="12" rx="3" fill="#22ff7a" stroke="#22ff7a" fill-opacity="0.10"/>
<text x="440" y="676" fill="#8fb3a5" font-size="11" font-family="'Prompt','Geist',system-ui,sans-serif">เกณฑ์ 10 นาที</text>
</svg>
