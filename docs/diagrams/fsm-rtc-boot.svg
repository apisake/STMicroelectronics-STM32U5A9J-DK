<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fsm-rtc-boot-title fsm-rtc-boot-desc" id="fsm-rtc-boot-root">
<title id="fsm-rtc-boot-title">RTC boot decision</title>
<desc id="fsm-rtc-boot-desc">Flowchart of how the firmware decides at boot whether to keep the RTC time or set it from the build time.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #fsm-rtc-boot-root { --color-paper: #050d0a; --color-ink: #e6f4ee; --color-muted: #8fb3a5; }
      #fsm-rtc-boot-root { font-family: 'Geist','Prompt',system-ui,sans-serif; color: var(--color-ink); }
      #fsm-rtc-boot-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#fsm-rtc-boot-root .diagram-container { overflow-x: visible; }
}</style>
<marker id="fsm-rtc-boot-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8fb3a5"/></marker>
<marker id="fsm-rtc-boot-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#22ff7a"/></marker>
<marker id="fsm-rtc-boot-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2ed3ff"/></marker>
</defs>
<rect width="100%" height="100%" fill="#050d0a"/>
<!-- transitions first, then labels, then nodes -->
<path d="M 360 72 L 360 104" fill="none" stroke="#8fb3a5" stroke-width="1.2" marker-end="url(#fsm-rtc-boot-arrow)"/>
<path d="M 360 152 L 360 184" fill="none" stroke="#8fb3a5" stroke-width="1.2" marker-end="url(#fsm-rtc-boot-arrow)"/>
