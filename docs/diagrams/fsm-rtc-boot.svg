<text x="360" y="61" fill="#e6f4ee" font-size="13" font-weight="600" font-family="'Geist','Prompt',system-ui,sans-serif" text-anchor="middle">rtc_clock_init</text>
<rect x="280" y="104" width="160" height="48" rx="6" fill="#050d0a"/>
<rect x="280" y="104" width="160" height="48" rx="6" fill="#0b1a14" stroke="#e6f4ee" stroke-width="1"/>
<text x="360" y="126" fill="#e6f4ee" font-size="13" font-weight="600" font-family="'Geist','Prompt',system-ui,sans-serif" text-anchor="middle">Start LSE</text>
<text x="360" y="142" fill="#8fb3a5" font-size="11" font-family="'Prompt','Geist',system-ui,sans-serif" text-anchor="middle">ไม่ติดใน 2 s → ใช้ LSI</text>
<rect x="280" y="184" width="160" height="48" rx="6" fill="#050d0a"/>
<rect x="280" y="184" width="160" height="48" rx="6" fill="#0b1a14" stroke="#e6f4ee" stroke-width="1"/>
<text x="360" y="206" fill="#e6f4ee" font-size="13" font-weight="600" font-family="'Geist','Prompt',system-ui,sans-serif" text-anchor="middle">Init + RSF sync</text>
<text x="360" y="222" fill="#8fb3a5" font-size="11" font-family="'Prompt','Geist',system-ui,sans-serif" text-anchor="middle">HAL_RTC_WaitForSynchro</text>
<polygon points="360,260 424,300 360,340 296,300" fill="#050d0a"/>
<polygon points="360,260 424,300 360,340 296,300" fill="#0b1a14" stroke="#e6f4ee" stroke-width="1"/>
<text x="360" y="298" fill="#e6f4ee" font-size="12" font-weight="600" font-family="'Geist','Prompt',system-ui,sans-serif" text-anchor="middle">Configured?</text>
<text x="360" y="314" fill="#8fb3a5" font-size="11" font-family="'Prompt','Geist',system-ui,sans-serif" text-anchor="middle">DR0 = magic</text>
<polygon points="600,260 664,300 600,340 536,300" fill="#050d0a"/>
<polygon points="600,260 664,300 600,340 536,300" fill="#22ff7a" stroke="#22ff7a" stroke-width="1" fill-opacity="0.10"/>
<text x="600" y="298" fill="#e6f4ee" font-size="12" font-weight="600" font-family="'Geist','Prompt',system-ui,sans-serif" text-anchor="middle">≤ 10 min behind</text>
<text x="600" y="314" fill="#8fb3a5" font-size="11" font-family="'Prompt','Geist',system-ui,sans-serif" text-anchor="middle">เวลาที่ build</text>
<rect x="280" y="400" width="160" height="48" rx="6" fill="#050d0a"/>
<rect x="280" y="400" width="160" height="48" rx="6" fill="#0b1a14" stroke="#e6f4ee" stroke-width="1"/>
<text x="360" y="422" fill="#e6f4ee" font-size="13" font-weight="600" font-family="'Geist','Prompt',system-ui,sans-serif" text-anchor="middle">Set from build</text>
<text x="360" y="438" fill="#8fb3a5" font-size="11" font-family="'Prompt','Geist',system-ui,sans-serif" text-anchor="middle">__DATE__ __TIME__</text>
<rect x="744" y="276" width="160" height="48" rx="6" fill="#050d0a"/>
<rect x="744" y="276" width="160" height="48" rx="6" fill="#0b1a14" stroke="#e6f4ee" stroke-width="1"/>
<text x="824" y="298" fill="#e6f4ee" font-size="13" font-weight="600" font-family="'Geist','Prompt',system-ui,sans-serif" text-anchor="middle">Keep RTC time</text>
<text x="824" y="314" fill="#8fb3a5" font-size="11" font-family="'Prompt','Geist',system-ui,sans-serif" text-anchor="middle">เวลาเดิมถูกต้อง</text>
<circle cx="600" cy="488" r="4" fill="#e6f4ee"/>
<rect x="520" y="512" width="160" height="48" rx="6" fill="#050d0a"/>
<rect x="520" y="512" width="160" height="48" rx="6" fill="#0b1a14" stroke="#e6f4ee" stroke-width="1"/>
<text x="600" y="534" fill="#e6f4ee" font-size="13" font-weight="600" font-family="'Geist','Prompt',system-ui,sans-serif" text-anchor="middle">Restore alarms</text>
<text x="600" y="550" fill="#8fb3a5" font-size="11" font-family="'Prompt','Geist',system-ui,sans-serif" text-anchor="middle">Alarm A (DR3) · B (DR4)</text>
<rect x="552" y="592" width="96" height="32" rx="16" fill="#050d0a"/>
<rect x="552" y="592" width="96" height="32" rx="16" fill="#0b1a14" stroke="#e6f4ee" stroke-width="1"/>
<text x="600" y="613" fill="#e6f4ee" font-size="13" font-weight="600" font-family="'Geist','Prompt',system-ui,sans-serif" text-anchor="middle">RTC ready</text>
<text x="40" y="600" fill="#8fb3a5" font-size="14" font-style="italic" font-family="'Instrument Serif','Noto Serif Thai',serif" text-anchor="start">แก้บั๊ก: เดิมตั้งใหม่ทุกครั้งที่ช้ากว่า build</text>
<line x1="32" y1="656" x2="928" y2="656" stroke="#e6f4ee" stroke-width="0.8" stroke-opacity="0.12"/>
<text x="32" y="676" fill="#8fb3a5" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" letter-spacing="0.14em">LEGEND</text>
