<path d="M 600 560 L 600 592" fill="none" stroke="#8fb3a5" stroke-width="1.2" marker-end="url(#fsm-rtc-boot-arrow)"/>
<rect x="368" y="364" width="20" height="12" rx="2" fill="#050d0a"/>
<text x="378" y="373" fill="#7f9e91" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>
<rect x="466" y="280" width="28" height="12" rx="2" fill="#050d0a"/>
<text x="480" y="289" fill="#7f9e91" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
<rect x="690" y="280" width="28" height="12" rx="2" fill="#050d0a"/>
<text x="704" y="289" fill="#22ff7a" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
<rect x="608" y="376" width="20" height="12" rx="2" fill="#050d0a"/>
<text x="618" y="385" fill="#7f9e91" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>
<rect x="300" y="40" width="120" height="32" rx="16" fill="#050d0a"/>
