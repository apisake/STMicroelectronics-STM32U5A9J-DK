<path d="M 664 300 L 744 300" fill="none" stroke="#22ff7a" stroke-width="1.4" marker-end="url(#fsm-rtc-boot-arrow-accent)"/>
<path d="M 600 340 L 600 416 A 8 8 0 0 1 592 424 L 440 424" fill="none" stroke="#8fb3a5" stroke-width="1.2" marker-end="url(#fsm-rtc-boot-arrow)"/>
<path d="M 360 448 L 360 480 A 8 8 0 0 0 368 488 L 596 488" fill="none" stroke="#8fb3a5" stroke-width="1.2" marker-end="url(#fsm-rtc-boot-arrow)"/>
