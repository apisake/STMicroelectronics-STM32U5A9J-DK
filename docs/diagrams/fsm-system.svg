<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fsm-system-title fsm-system-desc" id="fsm-system-root">
<title id="fsm-system-title">System power states</title>
<desc id="fsm-system-desc">State machine of the firmware: boot, running, Stop 2 sleep, waking and the fault state.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #fsm-system-root { --color-paper: #050d0a; --color-ink: #e6f4ee; --color-muted: #8fb3a5; }
      #fsm-system-root { font-family: 'Geist','Prompt',system-ui,sans-serif; color: var(--color-ink); }
      #fsm-system-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#fsm-system-root .diagram-container { overflow-x: visible; }
}</style>
<marker id="fsm-system-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8fb3a5"/></marker>
