      #fsm-radar-targets-root { --color-paper: #050d0a; --color-ink: #e6f4ee; --color-muted: #8fb3a5; }
      #fsm-radar-targets-root { font-family: 'Geist','Prompt',system-ui,sans-serif; color: var(--color-ink); }
      #fsm-radar-targets-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#fsm-radar-targets-root .diagram-container { overflow-x: visible; }
}</style>
