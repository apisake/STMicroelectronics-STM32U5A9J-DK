<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Colour of the day</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Prompt:wght@400;500;600&family=Noto+Serif+Thai:wght@400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --color-paper: #050d0a; --color-ink: #e6f4ee; --color-muted: #8fb3a5; }
  body { font-family: 'Geist','Prompt',system-ui,sans-serif; background: var(--color-paper); color: var(--color-ink);
         min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
  .frame { max-width: 1200px; width: 100%; }
  .diagram-container { width: 100%; overflow-x: auto; }
  .eyebrow { font-family: 'Geist Mono',ui-monospace,monospace; font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
             text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
  h1 { font-family: 'Instrument Serif','Noto Serif Thai',serif; font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
       letter-spacing: -0.02em; line-height: 1.25; color: var(--color-ink); margin-bottom: 1.5rem; }
  svg { width: 100%; min-width: 960px; display: block; }
  @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
</style>
</head>
<body>
<div class="frame">
<p class="eyebrow">State machine · สีธีม</p>
<h1>สีประจำวัน และการดูสีของวันอื่น</h1>
<div class="diagram-container">
<svg viewBox="0 0 960 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fsm-theme-title fsm-theme-desc">
<title id="fsm-theme-title">Colour of the day</title>
<desc id="fsm-theme-desc">State machine of the Thai colour-of-the-day theme with a tap preview that times out after 15 seconds.</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8fb3a5"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#22ff7a"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2ed3ff"/></marker>
</defs>
<rect width="100%" height="100%" fill="#050d0a"/>
<!-- transitions first, then labels, then nodes -->
<path d="M 170 196 L 220 196" fill="none" stroke="#8fb3a5" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 396 184 L 560 184" fill="none" stroke="#8fb3a5" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 560 208 L 396 208" fill="none" stroke="#8fb3a5" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<path d="M 280 160 C 280 112, 336 112, 336 160" fill="none" stroke="#22ff7a" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<path d="M 620 160 C 620 112, 676 112, 676 160" fill="none" stroke="#8fb3a5" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="464" y="164" width="28" height="12" rx="2" fill="#050d0a"/>
<text x="478" y="173" fill="#7f9e91" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" text-anchor="middle" letter-spacing="0.06em">TAP</text>
<rect x="434" y="216" width="88" height="12" rx="2" fill="#050d0a"/>
<text x="478" y="225" fill="#7f9e91" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" text-anchor="middle" letter-spacing="0.06em">15 S / NEW DAY</text>
<rect x="282" y="104" width="52" height="12" rx="2" fill="#050d0a"/>
<text x="308" y="113" fill="#22ff7a" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" text-anchor="middle" letter-spacing="0.06em">MIDNIGHT</text>
<rect x="634" y="104" width="28" height="12" rx="2" fill="#050d0a"/>
<text x="648" y="113" fill="#7f9e91" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" text-anchor="middle" letter-spacing="0.06em">TAP</text>
<circle cx="164" cy="196" r="6" fill="#e6f4ee"/>
<rect x="220" y="160" width="176" height="72" rx="8" fill="#050d0a"/>
<rect x="220" y="160" width="176" height="72" rx="8" fill="rgba(34,255,122,0.10)" stroke="#22ff7a" stroke-width="1"/>
<rect x="228" y="168" width="36" height="12" rx="2" fill="transparent" stroke="#22ff7a" stroke-opacity="0.5" stroke-width="0.8"/>
<text x="246" y="177" fill="#22ff7a" font-size="7" font-family="'Geist Mono',ui-monospace,monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
<text x="308" y="202" fill="#e6f4ee" font-size="14" font-weight="600" font-family="'Geist','Prompt',system-ui,sans-serif" text-anchor="middle">Follow day</text>
<text x="308" y="220" fill="#8fb3a5" font-size="11" font-family="'Prompt','Geist',system-ui,sans-serif" text-anchor="middle">สีประจำวันจาก RTC</text>
<rect x="560" y="160" width="176" height="72" rx="8" fill="#050d0a"/>
<rect x="560" y="160" width="176" height="72" rx="8" fill="#0b1a14" stroke="#e6f4ee" stroke-width="1"/>
<rect x="568" y="168" width="36" height="12" rx="2" fill="transparent" stroke="#8fb3a5" stroke-opacity="0.5" stroke-width="0.8"/>
<text x="586" y="177" fill="#8fb3a5" font-size="7" font-family="'Geist Mono',ui-monospace,monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
<text x="648" y="202" fill="#e6f4ee" font-size="14" font-weight="600" font-family="'Geist','Prompt',system-ui,sans-serif" text-anchor="middle">Preview</text>
<text x="648" y="220" fill="#8fb3a5" font-size="11" font-family="'Prompt','Geist',system-ui,sans-serif" text-anchor="middle">ดูสีของวันถัดไป</text>
<text x="480" y="300" fill="#8fb3a5" font-size="14" font-style="italic" font-family="'Instrument Serif','Noto Serif Thai',serif" text-anchor="middle">ทุกการเปลี่ยนสี ค่อย ๆ ไล่สีใน 0.6 วินาที</text>
<line x1="32" y1="320" x2="928" y2="320" stroke="rgba(230,244,238,0.12)" stroke-width="0.8"/>
<text x="32" y="340" fill="#8fb3a5" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" letter-spacing="0.14em">LEGEND</text>
<circle cx="130" cy="336" r="5" fill="#e6f4ee"/>
<text x="148" y="340" fill="#8fb3a5" font-size="11" font-family="'Prompt','Geist',system-ui,sans-serif">เริ่ม (ใช้สีวันนี้ทันที)</text>
<rect x="272" y="330" width="20" height="12" rx="3" fill="rgba(34,255,122,0.10)" stroke="#22ff7a"/>
<text x="300" y="340" fill="#8fb3a5" font-size="11" font-family="'Prompt','Geist',system-ui,sans-serif">สถานะหลัก</text>
<rect x="380" y="330" width="20" height="12" rx="3" fill="#0b1a14" stroke="#e6f4ee"/>
<text x="408" y="340" fill="#8fb3a5" font-size="11" font-family="'Prompt','Geist',system-ui,sans-serif">สถานะ</text>
<line x1="468" y1="336" x2="488" y2="336" stroke="#8fb3a5" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<text x="496" y="340" fill="#8fb3a5" font-size="11" font-family="'Prompt','Geist',system-ui,sans-serif">กลับเอง</text>
</svg>
</div>
</div>
</body>
</html>
