<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fsm-touch-title fsm-touch-desc" id="fsm-touch-root">
<title id="fsm-touch-title">Touch input</title>
<desc id="fsm-touch-desc">State machine of the polled touch input, including the blocked state that ignores the finger used to wake the board.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #fsm-touch-root { --color-paper: #050d0a; --color-ink: #e6f4ee; --color-muted: #8fb3a5; }
      #fsm-touch-root { font-family: 'Geist','Prompt',system-ui,sans-serif; color: var(--color-ink); }
      #fsm-touch-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#fsm-touch-root .diagram-container { overflow-x: visible; }
}</style>
<marker id="fsm-touch-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8fb3a5"/></marker>
<marker id="fsm-touch-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#22ff7a"/></marker>
<marker id="fsm-touch-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2ed3ff"/></marker>
</defs>
<rect width="100%" height="100%" fill="#050d0a"/>
<!-- transitions first, then labels, then nodes -->
